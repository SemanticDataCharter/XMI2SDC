[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xmi2sdc"
version = "4.0.0"
description = "Agentic XMI/UML to SDC4 data model converter"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
authors = [
    { name = "Timothy W. Cook", email = "tim@semanticdatacharter.org" },
]
keywords = ["sdc4", "xmi", "uml", "adk", "agents", "xml", "data-modeling", "enterprise-architect", "magicdraw"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "google-adk>=1.25",
    "litellm>=1.75.5",
    "click>=8",
    "pydantic>=2",
    "pyyaml>=6",
    "httpx>=0.27",
]

[project.scripts]
xmi2sdc = "xmi2sdc.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "black>=24",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/xmi2sdc"]

[tool.ruff]
line-length = 99
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.black]
line-length = 99
target-version = ["py311"]

[tool.coverage.run]
source = ["src/xmi2sdc"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
]
